<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, sans-serif; }
  body { background: transparent; padding: 6px 2px; }

  .row { display: flex; align-items: center; gap: 12px; }

  #mic-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, #0369a1, #0ea5e9);
    box-shadow: 0 3px 12px rgba(14,165,233,0.40);
    font-size: 18px; color: white; flex-shrink: 0;
    transition: all 0.2s ease;
  }
  #mic-btn:hover  { transform: scale(1.08); }
  #mic-btn.active {
    background: linear-gradient(135deg, #dc2626, #f87171);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 3px 12px rgba(220,38,38,.5); }
    50%      { box-shadow: 0 3px 22px rgba(220,38,38,.9); transform: scale(1.06); }
  }

  #status { font-size: 13px; color: #6b7280; font-weight: 500; }
  #status.on  { color: #dc2626; font-weight: 600; }
  #status.ok  { color: #0ea5e9; font-weight: 600; }
  #status.err { color: #f97316; }

  .wave { display: none; gap: 3px; align-items: flex-end; height: 18px; margin-left: 4px; }
  .wave.show { display: flex; }
  .wave b { display: block; width: 3px; border-radius: 2px; background: #dc2626; }
  .wave b:nth-child(1){height:6px;  animation: wv .8s .0s ease-in-out infinite;}
  .wave b:nth-child(2){height:14px; animation: wv .8s .1s ease-in-out infinite;}
  .wave b:nth-child(3){height:18px; animation: wv .8s .2s ease-in-out infinite;}
  .wave b:nth-child(4){height:12px; animation: wv .8s .3s ease-in-out infinite;}
  .wave b:nth-child(5){height:6px;  animation: wv .8s .4s ease-in-out infinite;}
  @keyframes wv {0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
</style>
</head>
<body>
<div class="row">
  <button id="mic-btn">🎙️</button>
  <div class="wave" id="wave"><b></b><b></b><b></b><b></b><b></b></div>
  <span id="status">Click mic and speak</span>
</div>

<script>
  function sendValue(val) {
    window.parent.postMessage({ type: "streamlit:setComponentValue", value: val }, "*");
  }
  function setHeight(h) {
    window.parent.postMessage({ type: "streamlit:setFrameHeight", height: h }, "*");
  }
  window.addEventListener("message", (e) => {
    if (e.data.type === "streamlit:render") setHeight(56);
  });
  setHeight(56);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById("mic-btn");
  const wave = document.getElementById("wave");
  const status = document.getElementById("status");

  if (!SR) {
    btn.disabled = true; btn.style.opacity = ".4";
    status.textContent = "⚠️ Use Chrome for voice"; status.className = "err";
  } else {
    const rec = new SR();
    rec.lang = "en-US"; rec.continuous = false; rec.interimResults = false;
    let on = false;

    function go(active) {
      on = active;
      btn.classList.toggle("active", active);
      wave.classList.toggle("show", active);
      btn.textContent = active ? "⏹️" : "🎙️";
      if (active) { status.textContent = "Listening…"; status.className = "on"; }
    }

    rec.onresult = (e) => {
      const t = e.results[0][0].transcript.trim();
      status.textContent = "✅ " + t; status.className = "ok";
      sendValue(t);
    };
    rec.onerror = (e) => {
      status.textContent = e.error === "not-allowed" ? "🚫 Mic blocked" : "Try again";
      status.className = "err"; go(false);
    };
    rec.onend = () => go(false);

    btn.onclick = () => on ? rec.stop() : (rec.start(), go(true));
  }
</script>
</body>
</html>
